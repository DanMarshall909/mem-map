[package]
name = "mem-map"
version = "0.1.0"
edition = "2024"
description = "A small native Windows memory monitor with bounded process history"
license = "MIT"

[build-dependencies]
embed-resource = "3.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Threading",
    "Win32_System_ProcessStatus", "Win32_System_SystemInformation",
    "Win32_System_Diagnostics_ToolHelp", "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs",
    "Win32_UI_Input_KeyboardAndMouse", "Win32_Security",
    "Win32_System_DataExchange", "Win32_System_Memory", "Win32_UI_Shell",
    "Win32_System_Com", "Win32_UI_Accessibility", "Win32_System_Time",
    "Win32_Storage_FileSystem",
] }
windows = { version = "0.62.2", features = [
    "Win32_Foundation", "Win32_UI_Accessibility", "Win32_System_Com",
    "Win32_System_Ole", "Win32_System_Variant", "Win32_System_WinRT", "UI_ViewManagement",
] }
windows-core = "0.62.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
