[package]
name = "mem-map"
version = "0.1.0"
edition = "2024"
description = "A Tauri Windows memory monitor with bounded Rust process history"
license = "MIT"

[features]
default = ["desktop"]
desktop = ["dep:tauri"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[target.'cfg(windows)'.dependencies]
tauri = { version = "2.12.4", optional = true, features = ["custom-protocol"] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Threading",
    "Win32_System_ProcessStatus", "Win32_System_SystemInformation",
    "Win32_System_Diagnostics_ToolHelp", "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs",
    "Win32_UI_Input_KeyboardAndMouse", "Win32_Security",
    "Win32_System_DataExchange", "Win32_System_Memory", "Win32_UI_Shell",
    "Win32_System_Com", "Win32_UI_Accessibility", "Win32_System_Time",
    "Win32_Storage_FileSystem",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
